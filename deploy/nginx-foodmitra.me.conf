# FoodMitra PHP (deploy this folder to /var/www/foodmitra)

server {
    listen 80;
    server_name foodmitra.me www.foodmitra.me;

    root /var/www/foodmitra;
    index index.php index.html;

    # JSON API
    location /api/ {
        alias /var/www/foodmitra/api/;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # Super admin (obscure path only — not linked publicly)
    location /admin6354932452/ {
        alias /var/www/foodmitra/admin6354932452/;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # Hotel admin = site root PHP files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.env { deny all; }
    location ~ /\.git { deny all; }
}
